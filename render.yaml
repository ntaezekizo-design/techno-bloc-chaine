services:
  - type: web
    name: ezekizo-blockchain
    runtime: node
    region: oregon
    plan: free
    branch: main
    buildCommand: npm install && node scripts/init-db.js
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: ezekizo-db
          property: connectionString

databases:
  - name: ezekizo-db
    databaseName: cryptomine
    user: ezekizo
    plan: free
    region: oregon
